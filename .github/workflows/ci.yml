name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kms
          POSTGRES_PASSWORD: kms
          POSTGRES_DB: kms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kms -d kms" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://kms:kms@localhost:5432/kms
      SEED_DEMO: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: |
            backend/data/models
            ~/.cache/huggingface
          key: models-${{ hashFiles('backend/app/config.py') }}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Retrieval quality gate
        run: python -m eval.gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
